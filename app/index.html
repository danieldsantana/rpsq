<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPSQ Programação Semanal</title>
<link rel="stylesheet" href="estilo.css?v=20261119">
</head>
<body>

<!-- Estrutura da tela, copiada da prévia aprovada. O conteúdo é desenhado pelos scripts de js/.
-->

<div class="title g"><b>RPSQ</b><span id="fname"></span><span class="pv" id="conexao"></span><span id="quem"></span><button id="b-sair" hidden>Sair</button></div>

<!-- Tela de entrada: aparece só quando não há ninguém logado (modo 'supabase') -->
<form class="entrada" id="entrada" autocomplete="on">
  <h1>RPSQ · Programação Semanal</h1>
  <label for="e-email">E-mail</label><input type="email" id="e-email" autocomplete="username" required>
  <label for="e-senha">Senha</label><input type="password" id="e-senha" autocomplete="current-password" required>
  <div class="erro" id="e-erro" role="alert"></div>
  <button class="rb main" type="submit" id="e-ok">Entrar</button>
</form>

<div class="ribbon g">
  <div class="grp"><label for="f-sem">Semana</label><select id="f-sem"></select>
    <span class="grp" id="adm-sem" hidden><label for="f-rev">Revisão</label><input type="text" id="f-rev" inputmode="numeric" autocomplete="off">
      <button class="rb" id="b-abrir">Abrir semana nova</button></span></div>
  <div class="grp"><label for="f-cant">Canteiro</label><select id="f-cant"></select></div>
  <div class="grp"><button class="rb" id="b-add">Adicionar atividade</button></div>
  <div class="grp">
    <button class="rb main" id="b-exp">Exportar Excel</button>
  </div>
  <div class="grp" id="adm" hidden><button class="rb" id="b-usuarios">Usuários</button><button class="rb" id="b-copia">Cópia de segurança</button></div>
</div>
<div class="addp g" id="addp" hidden></div>
<div class="fbar g">
  <div class="namebox" id="namebox">&nbsp;</div><span class="fx">fx</span>
  <input type="text" id="fx" aria-label="Conteúdo da célula" spellcheck="false" autocomplete="off" disabled>
</div>
<div class="work"><div class="sheet-area g" id="area"><div class="paper" id="paper"></div></div><aside class="pane" id="pane" aria-label="Lançamento da célula selecionada"></aside></div>
<datalist id="dl-torres"></datalist>
<div class="tabs g" id="tabs"></div>
<div class="toast" id="toast" hidden role="status"></div>

<!-- Bibliotecas copiadas (ver lib/LEIA-ME.md) -->
<script src="lib/supabase.js"></script>
<script src="lib/exceljs.min.js"></script>

<!-- Dados FICTÍCIOS usados pelo modo 'memoria' (demonstração e testes). No modo 'supabase' não são usados. -->
<script src="../testes/base-exemplo.js"></script>

<!-- App: a ordem importa, porque são scripts clássicos, sem import/export.
     ?v=AAAAMMDD: troque a data a cada atualização publicada, para nenhum navegador misturar
     arquivos novos com antigos guardados em cache (o app fica em uso durante as atualizações). -->
<script src="config.js?v=20261119"></script>
<script src="js/regras.js?v=20261119"></script>
<script src="js/dados-memoria.js?v=20261119"></script>
<script src="js/dados-supabase.js?v=20261119"></script>
<script src="js/planilha.js?v=20261119"></script>
<script src="js/painel.js?v=20261119"></script>
<script src="js/excel.js?v=20261119"></script>
<script src="js/admin.js?v=20261119"></script>
<script src="js/app.js?v=20261119"></script>
</body>
</html>
