<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste: carga do app</title>
<link rel="stylesheet" href="../app/estilo.css">
</head>
<body>
<script src="apoio.js"></script>
<script src="base-exemplo.js"></script>
<!-- mesma ordem de app/index.html -->
<script src="../app/lib/supabase.js"></script>
<script src="../app/lib/exceljs.min.js"></script>
<script src="../app/config.js"></script>
<script src="../app/js/regras.js"></script>
<script src="../app/js/dados-memoria.js"></script>
<script src="../app/js/dados-supabase.js"></script>
<script src="../app/js/planilha.js"></script>
<script src="../app/js/painel.js"></script>
<script src="../app/js/excel.js"></script>
<script src="../app/js/admin.js"></script>
<script src="../app/js/app.js"></script>
<script>
// Confere se todos os arquivos do app carregam sem erro e na ordem certa.
// Conforme as etapas avançam, este teste continua valendo: ele pega erro de digitação que impede a carga.
bloco('carga', function () {
  confere('biblioteca do Supabase', typeof supabase === 'object' && typeof supabase.createClient === 'function');
  confere('biblioteca ExcelJS', typeof ExcelJS === 'object' && typeof ExcelJS.Workbook === 'function');
  confere('configuração', typeof RPSQ_CONFIG === 'object' && ['memoria', 'supabase'].indexOf(RPSQ_CONFIG.dados) >= 0, RPSQ_CONFIG.dados);
  confere('a chave service_role não está no app', !/service_role/.test(JSON.stringify(RPSQ_CONFIG)));
  ['Regras', 'DadosMemoria', 'DadosSupabase', 'Planilha', 'Painel', 'Exportacao', 'Admin', 'App', 'Dados'].forEach(function (n) {
    confere('módulo ' + n, typeof window[n] === 'object' && window[n] !== null);
  });
  confere('camada de dados escolhida pela configuração', Dados === (RPSQ_CONFIG.dados === 'supabase' ? DadosSupabase : DadosMemoria));
  confere('ExcelJS gera uma pasta de trabalho', (function () { var wb = new ExcelJS.Workbook(); wb.addWorksheet('X1'); return wb.worksheets.length === 1; })());
});
fim();
</script>
</body>
</html>
